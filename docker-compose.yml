services:
  music-downloader:
    build:
      context: .
      args:
        # Change this value to force a fresh yt-dlp install on the next build.
        YTDLP_REFRESH: "${YTDLP_REFRESH:-1}"
    container_name: music-downloader
    restart: unless-stopped
    ports:
      # Publish only on your Tailscale IP when possible.
      # Set TAILSCALE_IP in .env (see .env.example).
      - "${TAILSCALE_IP:-0.0.0.0}:8787:8787"
    environment:
      BIND_HOST: "0.0.0.0"
      PORT: "8787"
      # Inside the container downloads always write to /data.
      # That directory is the host folder from HOST_DOWNLOAD_DIR (volume below).
      OUTPUT_DIR: "/data"
      BROWSE_ROOT: "/data"
      # Host path string for UI display (must match the volume source).
      HOST_DOWNLOAD_DIR: "${HOST_DOWNLOAD_DIR:-./downloads}"
      ALLOW_LOCALHOST: "1"
      # Docker NATs client IPs — rely on publishing only to TAILSCALE_IP.
      REQUIRE_TAILSCALE_CLIENT: "0"
      DOCKER: "1"
      # Download methods tried per song, in order (";" separates methods,
      # "," groups yt-dlp player clients). Leave unset for the built-in ladder:
      #   auto;web_safari;android_vr;ios;mweb;tv
      # YTDLP_STRATEGIES: "auto;web_safari;android_vr"
      # Pin a single client set instead (disables the ladder):
      # YTDLP_PLAYER_CLIENTS: "web_safari,web_embedded"
      # How many methods to try per song before giving up (default 4).
      # YTDLP_MAX_STRATEGIES: "4"
    volumes:
      # Changing HOST_DOWNLOAD_DIR in .env only takes effect after recreate:
      #   docker compose up -d --force-recreate
      - "${HOST_DOWNLOAD_DIR:-./downloads}:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
