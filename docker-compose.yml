services:
  music-downloader:
    build: .
    container_name: music-downloader
    restart: unless-stopped
    ports:
      # Recommended: publish only on your Tailscale IP so LAN/public can't reach it.
      # Set TAILSCALE_IP in a .env file (see .env.example), e.g. TAILSCALE_IP=100.64.1.2
      - "${TAILSCALE_IP:-0.0.0.0}:8787:8787"
    environment:
      BIND_HOST: "0.0.0.0"
      PORT: "8787"
      OUTPUT_DIR: "/data"
      ALLOW_LOCALHOST: "1"
      # Docker port-publish NATs client IPs, so in-app Tailscale ACL can't see 100.x peers.
      # Keep this off and rely on publishing only to TAILSCALE_IP above.
      REQUIRE_TAILSCALE_CLIENT: "0"
      DOCKER: "1"
    volumes:
      # Host folder ↔ container /data (MP3s appear on the PC)
      # Set HOST_DOWNLOAD_DIR in .env, e.g. D:/Music or ./downloads
      - "${HOST_DOWNLOAD_DIR:-./downloads}:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
